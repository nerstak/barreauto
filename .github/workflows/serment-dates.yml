name: Serment dates

on:
  workflow_dispatch:
  schedule:
    # UTC times corresponding to 10:00, 13:00, 17:00, 19:00 in Europe/Paris (UTC+2, DST)
    - cron: "7 8,11,15,17 * * *"

permissions:
  contents: read

concurrency:
  group: serment-dates
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      PIP_NO_CACHE_DIR: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      EMAIL: ${{ secrets.EMAIL }}
      PASSWORD: ${{ secrets.PASSWORD }}
      AVOCATPARIS_TOTP: ${{ secrets.AVOCATPARIS_TOTP }}
      NTFY_ALL_CHANNEL: ${{ secrets.NTFY_ALL_CHANNEL }}
      NTFY_FREE_CHANNEL: ${{ secrets.NTFY_FREE_CHANNEL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5.0.0
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install --disable-pip-version-check --no-input requests

      - name: Run scraper
        run: python avocatparis_serment_dates.py --timeout 30